[package]
name = "app"
version = "0.1.0"
description = "TickerDock - a compact desktop ticker for A-shares and US stocks"
authors = ["TickerDock contributors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
